<!doctype html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sidan hittades inte</title>
<script>
// GitHub Pages näyttää tämän sivun, kun osoitetta ei löydy. Tuotesivun koko-osoitteet (/butik/...latt-brunnslock-1050-composite,
// /butik/luckor/durkplatsluckor/durkplatslucka-400x400-golv-vagg)
// ohjataan takaisin tuotesivulle oikealla koolla, ja sivu vaihtaa osoiteriville saman slugin. /fi/butik/... avaa suomenkielisen sivun.
(function () {
  var p = location.pathname, i = p.indexOf('/butik/');
  if (i < 0) return;
  var pre = p.slice(0, i), fi = /\/fi$/.test(pre);
  if (fi) pre = pre.slice(0, -3);
  var m = p.match(/latt-brunnslock-(\d+)-composite/), d = p.match(/durkplatslucka-(\d+x\d+)-golv-vagg/);
  var q = d ? '?p=durk&size=' + d[1] : m ? '?size=' + m[1] : '';
  location.replace(pre + '/' + (fi ? 'FiTuote' : 'SvProdukt') + '.dc.html' + q + location.hash);
})();
</script>
<style>
body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #f5f5f4; color: #111111; font: 16px/1.55 Inter, system-ui, sans-serif; }
main { max-width: 32rem; padding: 24px; }
a { color: #111111; font-weight: 600; }
</style>
</head>
<body>
<main>
<h1 style="margin: 0 0 8px; font-size: 28px">Sidan hittades inte</h1>
<p style="margin: 0">Prototypen har ingen sida på den här adressen. <a id="home" href="./">Till startsidan</a></p>
</main>
<script>try { document.getElementById('home').href = '/' + (location.pathname.split('/')[1] || '') + '/'; } catch (e) {}</script>
</body>
</html>
